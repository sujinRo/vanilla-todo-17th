<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Things to do</h1>
      <form class="inputForm" onsubmit="return false">
        <input
          id="inputPlan"
          type="text"
          placeholder="Enter your to do!"
          onkeypress="enterkey()"
        />
        <button id="addBtn" type="button" onclick=" handleAddBtnClick()">
          +
        </button>
      </form>
      <hr />
      <div class="todo">
        <h1 class="subTitle">📒to do</h1>
        <span class="todoCount"
          >total item:
          <div class="todoCount" id="todoCount">0</div></span
        >
        <ul type="none" id="todoList"></ul>
      </div>
      <hr />
      <div class="done">
        <h1 class="subTitle">📂done</h1>
        <span class="doneCount"
          >total item:
          <div class="doneCount" id="doneCount">0</div></span
        >
        <ul type="none" id="doneList"></ul>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
